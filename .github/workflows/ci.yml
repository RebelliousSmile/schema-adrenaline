name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: schema-adrenaline
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        working-directory: schema-adrenaline
        run: npm ci

      - name: Check schemas and Handbook package
        working-directory: schema-adrenaline
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run check

      - name: Verify generated schemas are committed
        working-directory: schema-adrenaline
        run: git diff --exit-code

      - name: Read minimum Handbook release
        id: handbook-ref
        working-directory: schema-adrenaline
        # Handbook tags are `v<x.y.z>` (bare `<x.y.z>` up to 2.8.3). The release a pack asks for
        # is published after the provider in the same train, so until its tag exists the host is
        # read from `main`, whose own version must then be at least the minimum the pack declares.
        run: |
          min=$(node -p 'require("./handbook/adrenaline/pack.json").minimumHandbookVersion')
          repo=https://github.com/RebelliousSmile/obsidian-handbook
          ref=
          for candidate in "v$min" "$min"; do
            if git ls-remote --exit-code --tags "$repo" "refs/tags/$candidate" > /dev/null; then ref="$candidate"; break; fi
          done
          if [ -z "$ref" ]; then
            ref=main
            main_version=$(curl -fsS https://raw.githubusercontent.com/RebelliousSmile/obsidian-handbook/main/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
            lowest=$(printf '%s\n%s\n' "$min" "$main_version" | sort -V | head -n 1)
            [ "$lowest" = "$min" ] \
              || { echo "Handbook main is $main_version, below the declared minimum $min"; exit 1; }
          fi
          echo "tag=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout declared Handbook release
        uses: actions/checkout@v4
        with:
          repository: RebelliousSmile/obsidian-handbook
          ref: ${{ steps.handbook-ref.outputs.tag }}
          path: handbook-host

      - name: Install Handbook dependencies
        working-directory: handbook-host
        run: npm install --legacy-peer-deps

      # Handbook's source-assertion script (tools/assert-adrenaline-source.mjs) is
      # deliberately not run here. It only exists on the frozen 2.7.x tags, where its
      # harness hardcodes the pack version it expects (`0.2.0`), so it fails on every
      # pack bump and no upstream fix can ever reach it. Its manifest-shape coverage now
      # lives in this repository, in tools/validate-handbook-pack.ts; current Handbook
      # CI also checks source witnesses against this provider's manifest on every PR.
      # `assert:adrenaline-theme` is kept on purpose: its value is not to test Handbook's
      # frozen SCSS, but to prove that the minimum supported host can still read the
      # current manifest. Do not drop it by the same reasoning as the source assertion.
      - name: Check package theme against declared Handbook release
        working-directory: handbook-host
        env:
          SCHEMA_ADRENALINE_ROOT: ${{ github.workspace }}/schema-adrenaline
        run: npm run assert:adrenaline-theme

      - name: Install catalogue through declared Handbook release
        working-directory: schema-adrenaline
        env:
          HANDBOOK_ROOT: ${{ github.workspace }}/handbook-host
        run: npx tsx tools/validate-handbook-install.ts
