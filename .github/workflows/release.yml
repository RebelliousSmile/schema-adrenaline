name: Release contract

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to promote
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    # The one human gate of a train: the environment's required reviewer approves
    # the final from the Actions page, with no terminal involved.
    environment: release
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Verify tag matches package version
        run: node -e 'const pkg=require("./package.json"); if(process.env.RELEASE_TAG !== `v${pkg.version}`) process.exit(1)'

      - name: Install dependencies
        run: npm ci

      - name: Require the committed immutable release train
        run: |
          manifest="release-train/schema-adrenaline-$RELEASE_TAG.json"
          test -f "$manifest"
          npm run release-train:assert -- "$manifest"
          expected=$(node -e 'const m=require(`./${process.argv[1]}`); process.stdout.write(m.candidate.providerCommit)' "$manifest")
          git merge-base --is-ancestor "$expected" "$GITHUB_SHA"

      - name: Check provider release contract
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEMA_ADRENALINE_PENDING_RELEASE: ${{ env.RELEASE_TAG }}
        run: npm run release:verify-provider

      - name: Download verified candidate asset
        id: candidate
        run: |
          manifest="release-train/schema-adrenaline-$RELEASE_TAG.json"
          archive="schema-adrenaline-${RELEASE_TAG#v}.tgz"
          checksum="$archive.sha256"
          url=$(node -e 'const m=require(`./${process.argv[1]}`); process.stdout.write(m.candidate.releaseUrl)' "$manifest")
          sha=$(node -e 'const m=require(`./${process.argv[1]}`); process.stdout.write(m.candidate.sha256)' "$manifest")
          curl --fail --location --proto '=https' --output "$archive" "$url"
          test "$(sha256sum "$archive" | cut -d ' ' -f 1)" = "$sha"
          packed=$(npm pack --json --silent --ignore-scripts | node -e 'let data=""; process.stdin.on("data", chunk => data += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(data)[0].filename))')
          test "$(sha256sum "$packed" | cut -d ' ' -f 1)" = "$sha"
          printf '%s  %s\n' "$sha" "$archive" > "$checksum"
          {
            echo "sha=$sha"
            echo "archive=$archive"
            echo "checksum=$checksum"
          } >> "$GITHUB_OUTPUT"

      - name: Create or resume draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARCHIVE: ${{ steps.candidate.outputs.archive }}
          RELEASE_CHECKSUM: ${{ steps.candidate.outputs.checksum }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "$RELEASE_ARCHIVE" "$RELEASE_CHECKSUM" --clobber

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$RELEASE_TAG" --draft=false
          for attempt in {1..12}; do
            immutable=$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .immutable)
            digest=$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets[] | select(.name | endswith(".tgz")) | .digest')
            if test "$immutable" = "true" && test -n "$digest"; then break; fi
            sleep 5
          done
          test "$immutable" = "true"
          test "$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets | length')" = "2"
          test "$digest" = "sha256:${{ steps.candidate.outputs.sha }}"

  # The consumers adopt the final through their own `Bump schema` workflow, which
  # merges on its own once their CI is green.
  notify-consumers:
    needs: release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.TRAIN_DISPATCH_TOKEN }}
    steps:
      - name: Ask each consumer to open its bump pull request
        run: |
          if test -z "$GH_TOKEN"; then
            echo "::error::TRAIN_DISPATCH_TOKEN is not set: $RELEASE_TAG is published, but no consumer was notified"
            exit 1
          fi
          for consumer in RebelliousSmile/obsidian-handbook RebelliousSmile/lantern; do
            gh api "repos/$consumer/dispatches" \
              -f event_type=schema-published \
              -f "client_payload[package]=schema-adrenaline" \
              -f "client_payload[tag]=$RELEASE_TAG"
          done

  # The final bumps merge on their own, so no one is asked to record the end of the
  # train: this waits for both consumers, writes the protocol-2 record and hands it
  # to `Final convergence`, which stays its judge.
  converge:
    needs: notify-consumers
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      actions: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm ci

      - name: Record the final convergence
        run: |
          record=$(npx tsx tools/write-release-train.ts final "$RELEASE_TAG" --wait-minutes 120 | tail -n 1)
          test -f "$record"
          git add "$record"
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(release): record the $RELEASE_TAG convergence" -- "$record"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          gh workflow run final-convergence.yml --ref main -f record="$record"
