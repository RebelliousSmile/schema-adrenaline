name: Release train

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Committed release-train manifest path
        required: true
        type: string

permissions:
  contents: read

jobs:
  assert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Validate committed candidate manifest
        id: train
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          case "$MANIFEST" in release-train/schema-adrenaline-v*.json) ;; *) exit 1 ;; esac
          test -f "$MANIFEST"
          npm ci --ignore-scripts
          npm run release-train:assert -- "$MANIFEST"
          node -e 'const fs=require("fs");const m=JSON.parse(fs.readFileSync(process.env.MANIFEST));for(const c of m.consumers) console.log(`${c.role}=${c.ref}`);console.log(`candidate_provider_commit=${m.candidate.providerCommit}`)' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: RebelliousSmile/lantern
          ref: ${{ steps.train.outputs.lantern }}
          path: release-train-lantern
      - uses: actions/checkout@v4
        with:
          repository: RebelliousSmile/obsidian-handbook
          ref: ${{ steps.train.outputs.handbook }}
          path: release-train-handbook
      - uses: actions/checkout@v4
        with:
          repository: RebelliousSmile/schema-adrenaline
          ref: ${{ steps.train.outputs.candidate_provider_commit }}
          path: release-train-adrenaline-source
          fetch-depth: 0
      - name: Run consumer-owned proofs
        env:
          MANIFEST: ${{ inputs.manifest }}
          SCHEMA_ADRENALINE_ROOT: ${{ github.workspace }}/release-train-adrenaline-source
        run: |
          cp "${{ inputs.manifest }}" release-train-lantern/release-train.json
          cp "${{ inputs.manifest }}" release-train-handbook/release-train.json
          (cd release-train-lantern && corepack enable && pnpm install --frozen-lockfile --ignore-scripts)
          (cd release-train-handbook && corepack enable && pnpm install --frozen-lockfile --ignore-scripts)
          (cd release-train-lantern && npm run --silent release-train:assert -- release-train.json)
          (cd release-train-handbook && npm run --silent release-train:assert -- release-train.json)
          cp release-train-lantern/release-train.json.evidence.json lantern-proof.json
          cp release-train-handbook/release-train.json.evidence.json handbook-proof.json
          npx tsx tools/verify-release-train-proofs.ts "$MANIFEST" lantern-proof.json handbook-proof.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-train-proofs
          path: |
            lantern-proof.json
            handbook-proof.json
